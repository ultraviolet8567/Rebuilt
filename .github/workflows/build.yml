name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, format, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GradleRIO needs a JDK; it is not installed on the runner by default.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle wrapper and dependency cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs compileJava, spotlessCheck, and test, so a formatting slip or a
      # broken unit test fails the build exactly as it does locally.
      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
